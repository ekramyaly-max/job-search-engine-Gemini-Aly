# JOB SEARCH SETTINGS

sites:
  - linkedin
  - indeed

optional_sites:
  - bayt
  - google
  - glassdoor
  - zip_recruiter

locations:
  - name: "Dubai, UAE"
    country: "United Arab Emirates"
  - name: "Doha, Qatar"
    country: "Qatar"
  - name: "Riyadh, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "Toronto, Canada"
    country: "Canada"

# Boost Gulf jobs by +1 in the final ranking
preferred_locations:
  - Dubai
  - UAE
  - Doha
  - Qatar
  - Riyadh
  - Saudi

search_terms:
  - "network operations manager"
  - "NOC manager"
  - "service delivery manager telecom"
  - "major incident manager"
  - "cloud operations manager"
  - "IT infrastructure manager"
  - "telecom project manager"

employment_types:
  - fulltime

# 1. HARD GATE: Title MUST contain one of these (English, French, or Arabic)
role_keywords:
  - network
  - noc
  - operations
  - delivery
  - incident
  - escalation
  - reliability
  - cloud
  - manager
  - director
  - project
  - program
  - leader
  - gestionnaire
  - مدير
  - réseau
  - شبكات
  - شبكة
  - الشبكات
  - الشبكة
  - اتصالات
  - الاتصالات

# 2. HARD GATE: Title MUST contain a seniority word
seniority_keywords:
  - senior
  - manager
  - head
  - lead
  - director
  - leader
  - gestionnaire
  - مدير

# 3. EXCLUDE: Job is dropped if title contains any of these
exclude_title_words:
  - store
  - retail
  - sales
  - marketing
  - recruiter
  - hr
  - human resources
  - customer success
  - finance
  - accounting
  - legal
  - warehouse
  - hospitality
  - construction
  - highways
  - clinical
  - driver
  - logistics
  - real estate

# INDUSTRY MATCHING
industries:
  - telecom
  - telecommunications
  - networking
  - network operations
  - cloud
  - data center
  - wireless
  - 5G
  - fiber
  - managed services

# JOB FUNCTION MATCHING
job_functions:
  - operations
  - delivery
  - incident
  - project
  - program

# SCORING SYSTEM
min_relevance_score: 3

# High-value title words (+3 points)
title_keywords:
  - network
  - NOC
  - telecom
  - telecommunications
  - cloud
  - infrastructure
  - incident
  - escalation
  - reliability
  - wireless
  - fiber
  - 5G
  - data center
  - service delivery
  - managed services
  - ICT
  - OSP
  - outside plant
  - réseau
  - شبكات
  - شبكة
  - الشبكات
  - الشبكة
  - اتصالات
  - الاتصالات

# Related fields (+1 point, sends to MAYBE list)
adjacent_title_keywords:
  - cyber
  - cybersecurity
  - security
  - devops
  - digital
  - platform
  - application

# PRIORITY BONUS (+3 points added to Final Rank Score)
priority_companies:
  - Verizon
  - AT&T
  - Cisco
  - HPE
  - Bell
  - Rogers
  - TELUS
  - Motorola Solutions
  - Nokia
  - Ericsson

# False-positive companies (never marked as priority)
not_priority_companies:
  - Bell Techlogix
  - Bell Textron
  - Bell Flight
  - Bell Bank
  - Bell Helicopter

days_back: 7
results_per_search: 20
linkedin_fetch_description: true
skip_site_after_failures: 4
