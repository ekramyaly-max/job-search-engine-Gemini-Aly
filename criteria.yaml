# JOB SEARCH SETTINGS (v12) - edit anytime
# Works only with find_jobs.py v12 (the top of the file says v12). Replace the whole file.

sites:
  - linkedin
  - indeed

optional_sites:
  - bayt
  - google
  - glassdoor
  - zip_recruiter

# Aimed at manager, senior manager and director roles in managed services,
# service delivery and customer operations (telecom), with a path into cloud and IT networking.
search_terms:
  - "senior service delivery manager"
  - "managed services director"
  - "head of service delivery"
  - "customer operations manager telecom"
  - "network operations manager"
  - "major incident manager"
  - "cloud service delivery manager"
  - "telecom program manager"

locations:
  - name: "Dubai, UAE"
    country: "United Arab Emirates"
  - name: "Doha, Qatar"
    country: "Qatar"
  - name: "Riyadh, Saudi Arabia"
    country: "Saudi Arabia"
  - name: "Toronto, Canada"
    country: "Canada"
  - name: "United States"
    country: "USA"

employment_types:
  - fulltime

remote_only: false

# 1. HARD GATE: Title MUST contain at least one role/title word
role_keywords:
  - network
  - noc
  - operations
  - delivery
  - incident
  - escalation
  - reliability
  - cloud
  - manager
  - director
  - head
  - vp
  - president
  - executive
  - leader
  - lead
  - program
  - project
  - portfolio
  - resource
  - care
  - gestionnaire
  - directeur
  - مدير
  - réseau
  - شبكات
  - شبكة
  - الاتصالات

# 2. HARD GATE: Title MUST contain a seniority level
seniority_keywords:
  - senior
  - manager
  - head
  - lead
  - leader
  - director
  - executive
  - vice president
  - vp
  - president
  - chief
  - general manager
  - gestionnaire
  - directeur
  - directrice
  - مدير

# 2b. NOT A MANAGER: a title with one of these words is dropped
# unless it ALSO has a word from management_words below.
# (This removes jobs like "Senior Cloud Engineer".)
individual_contributor_words:
  - engineer
  - technician
  - developer
  - architect
  - analyst
  - specialist
  - administrator
  - consultant
  - designer
  - programmer
  - scientist
  - ingenieur
  - technicien
